name: CD Practica Profesional ms-autenticacion-usuarios

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Create Docker Network
        run: |
          docker network create --driver bridge --opt com.docker.network.driver.mtu=1400 maestria-network || echo "Network already exists"

      - name: Ensure Eureka Discovery Server is Running (directory)
        run: |
          echo "Ensuring Eureka Discovery Server is running (retry up to 5 times)..."
          for attempt in 1 2 3 4 5; do
            if docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep -q '^directory-service$'; then
              echo "Eureka Discovery Server is already running (found on attempt $attempt)."
              break
            fi
            echo "Eureka not running, attempt $attempt/5..."
            if [ -z "$(docker ps -a -q -f name=directory-service)" ]; then
              echo "Creating directory-service container..."
              docker run -d \
                --name "directory-service" \
                --network "maestria-network" \
                --network-alias "directory" \
                -p 8765:8761 \
                --restart "always" \
                --memory "256m" \
                --memory-swap "256m" \
                --label project="practica-u" \
                --label service="directory" \
                -e JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -XX:+UseSerialGC -Xms64m -Xmx192m" \
                $DOCKER_USERNAME/practica-profesional-directory:latest
            else
              echo "Starting existing directory-service container..."
              docker start directory-service 2>/dev/null || true
            fi
            if [ $attempt -lt 5 ]; then
              echo "Waiting 6s before next attempt..."
              sleep 6
            fi
          done
          if ! docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep -q '^directory-service$'; then
            echo "ERROR: Eureka Discovery Server failed to start after 5 attempts."
            exit 1
          fi
          echo "Eureka Discovery Server is ready."

      - name: Infrastructure Diagnosis & Cleanup
        run: |
          echo "--- DISK SPACE CHECK ---"
          df -h || true
          echo "--- CLEANING OLD CONTAINER ---"
          docker rm -f autenticacion-service || true

      - name: Pull Application Image (with Retry Logic)
        run: |
          echo "Attempting to pull image with auto-retry for stability..."
          for i in 1 2 3; do
            docker pull $DOCKER_USERNAME/practica-profesional-autenticacion-usuarios:latest && exit 0 || \
            (echo "Attempt $i failed, waiting 10s..." && sleep 10)
          done
          echo "All pull attempts failed."
          exit 1

      - name: Run Application Container
        run: |
          docker run -d \
            --name "autenticacion-service" \
            --network "maestria-network" \
            --network-alias "autenticacion-service" \
            --network-alias "autenticacion" \
            -p 8096:8096 \
            --restart "always" \
            --memory "256m" \
            --memory-swap "256m" \
            --label project="practica-u" \
            --label service="autenticacion" \
            -e SPRING_PROFILES_ACTIVE="dev" \
            -e SPRING_SERVER_AUTH_PORT="8096" \
            -e SPRING_JWT_KEY="secretKey123" \
            -e SPRING_JWT_EXPIRATION="3600000" \
            -e JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -XX:+UseSerialGC -Xms64m -Xmx192m" \
            $DOCKER_USERNAME/practica-profesional-autenticacion-usuarios:latest

      - name: Clean Old Images of This Service
        run: |
          echo "Cleaning old images for autenticacion service..."
          # Remove stopped containers first
          docker ps -a --filter "label=service=autenticacion" --filter "status=exited" -q | xargs -r docker rm 2>/dev/null || true
          # Prune dangling images (catches <none>:<none> orphans)
                    echo 'Removing dangling images for this service...'
          docker images --filter 'dangling=true' --filter 'label=service=autenticacion' -q | xargs -r docker rmi -f 2>/dev/null || true
          # Remove old tagged images (keep only latest)
          CURRENT_IMAGE=$(docker inspect autenticacion-service --format='{{.Image}}' 2>/dev/null || echo "")
          if [ -n "$CURRENT_IMAGE" ]; then
            CURRENT_SHORT="${CURRENT_IMAGE:7:12}"
            docker images $DOCKER_USERNAME/practica-profesional-autenticacion-usuarios --format "{{.ID}} {{.Tag}}" | while read img_id tag; do
              if [ "$tag" != "latest" ] && [ "${img_id:0:12}" != "$CURRENT_SHORT" ]; then
                echo "Removing old tagged image: $img_id ($tag)"
                docker rmi -f "$img_id" 2>/dev/null || true
              fi
            done
          fi

      - name: Final Status Check
        run: |
          sleep 5
          docker ps | grep autenticacion-service || true
          echo "--- LAST 20 LINES OF LOGS ---"
          docker logs --tail 20 autenticacion-service || true
